[project]
name = "wheresmymoney"
# The date it was released (a second release that day adds .1, .2…).
version = "2026.11.7"
description = "Self-hosted family money: accounts that offset the home loan, balance check-ins, statement imports, bills and spending"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    # FastAPI's web layer; at least the release that fixes its known security advisories.
    "starlette>=1.3.1",
    "uvicorn[standard]==0.39.0",
    # Web push: encrypting each notification for the browser, and signing it (VAPID).
    "pycryptodomex==3.23.0",
    # Reading super statements (PDF) on the server, so they never leave the house.
    "pypdf==6.1.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",  # Starlette's TestClient (it warns that plain httpx is deprecated)
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.13",
]

[tool.wheresmymoney]
# How far along it is, shown beside the version in Settings → Updates. Left out once it's stable.
release = "alpha"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # long lines: the formatter handles what it can; long SQL and messages stay readable
    "RUF001",  # ambiguous unicode: user-facing copy uses en dashes and minus signs on purpose
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
packages = ["app"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["Cryptodome.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",  # inside Starlette's TestClient
]
