services:
  # WheresMyMoney: the app and its API, with the household's database in ./data.
  wheresmymoney:
    build:
      context: .
      args:
        # The commit it's built from (install.sh sets it), so Settings → Updates can tell when there's a newer one.
        GIT_COMMIT: ${GIT_COMMIT:-}
    container_name: wheresmymoney
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./data:/data
    environment:
      TZ: ${TZ:-Australia/Brisbane}
      TZ_CHOSEN: ${TZ:-}
      AUTH: ${AUTH:-true}
      DEMO: ${DEMO:-false}
      API_DOCS: ${API_DOCS:-false}
      # Behind a reverse proxy: its address, so sign-in sees each browser's address rather than the proxy's.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    # Logs are kept to 3 files of 10 MB (an SD card in a Raspberry Pi wears out with endless writing).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
